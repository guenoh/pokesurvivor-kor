name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node kor/upstream-boundary.cjs
      - run: node kor/module-source.cjs
      - run: bash .github/scripts/test-sync.sh
      - run: node --test tests/*.test.cjs
      - run: node tools/build.js --sin-seo
      - run: node kor/coverage.cjs
      - run: node kor/package.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korean-static-site
          path: dist/
          retention-days: 7
